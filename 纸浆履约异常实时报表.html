<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸浆履约异常实时报表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233164AE'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='%23FFFFFF' opacity='0.94'/%3E%3Cpath d='M11 14h10M11 18h10M11 22h6' stroke='%23F23A3B' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F1F4F8;
  --surface:#FFFFFF;
  --ink-900:#3164AE;
  --ink-700:#3164AE;
  --t1:#1C2733;
  --t2:#5F6B7A;
  --t3:#98A2B3;
  --line:#E4E9F0;
  --line-2:#D8DFE8;
  --brand:#F23A3B;
  --brand-soft:#FDEBEB;
  --alert:#F23A3B;
  --alert-soft:#FDECEC;
  --group:#EDF1F7;
  --zebra:#F8FAFC;
  --hdr:#F6F8FB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  background:#E4E9F0;
  color:var(--t1);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
#app{
  display:flex;flex-direction:column;
  width:100%;max-width:400px;
  aspect-ratio:9 / 19.5;
  height:auto;
  max-height:100vh;max-height:100dvh;
  margin:0 auto;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}
#app.wide-mode{max-width:none;aspect-ratio:auto;height:100vh;height:100dvh;max-height:none}
/* ===== 顶部标题区 ===== */
.app-header{
  background:var(--ink-900);
  color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 12px;
  border-bottom:3px solid var(--brand);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex:none;
}
.hd-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{
  width:36px;height:36px;flex:none;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}
.hd-title{min-width:0}
.hd-title h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:11px;color:#A9BBD0;font-variant-numeric:tabular-nums}
.live-dot{width:7px;height:7px;border-radius:50%;background:#35C98D;flex:none;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(53,201,141,.5)}50%{opacity:.55;box-shadow:0 0 0 4px rgba(53,201,141,0)}}
.btn-rotate{
  flex:none;
  display:inline-flex;align-items:center;gap:5px;
  padding:9px 13px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:8px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:12px;font-weight:500;
  cursor:pointer;
  transition:background .15s;
}
.btn-rotate:active{background:rgba(255,255,255,.18)}
.btn-rotate svg{flex:none}
/* ===== 页签 ===== */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.tab{
  flex:1;position:relative;
  padding:13px 4px 12px;
  border:none;background:none;
  font-size:15px;color:var(--t2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:color .15s;
}
.tab:active{background:#F7F9FC}
.tab.active{color:var(--ink-900);font-weight:700}
.tab.active::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:0;width:52px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);
}
.tab-count{
  font-size:10px;font-weight:600;color:var(--t3);
  background:#F0F3F7;border-radius:8px;padding:1px 6px;line-height:1.5;
  font-variant-numeric:tabular-nums;
}
.tab.active .tab-count{color:var(--brand);background:var(--brand-soft)}
.tab-count.zero{opacity:.75}
/* ===== KPI 条 ===== */
.kpi-strip{
  display:flex;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:9px 12px;gap:8px;flex:none;
}
.kpi{flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.kpi-label{font-size:11px;color:var(--t2)}
.kpi-val{font-size:16px;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.kpi-val.warn{color:var(--alert)}
.kpi-val .unit{font-size:11px;font-weight:500;color:var(--t2);margin-left:2px}
/* ===== 表格滚动区 ===== */
.tbl-scroll{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);position:relative;
  overscroll-behavior:contain;
}
.tbl-scroll::-webkit-scrollbar{width:5px;height:5px}
.tbl-scroll::-webkit-scrollbar-thumb{background:#C3CCD8;border-radius:3px}
.tbl-scroll::-webkit-scrollbar-track{background:transparent}
table{
  width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;
  font-size:13px;
}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;white-space:nowrap}
thead th{
  background:var(--hdr);color:#475467;font-size:12px;font-weight:600;
  position:sticky;top:0;z-index:30;
  text-align:right;
  border-bottom:1px solid var(--line-2);
}
thead th .th-main{display:block}
thead th .th-sub{display:block;font-size:10px;color:#8A94A6;font-weight:500;margin-top:1px}
th.col-cust,th.col-prod{text-align:left}
th.col-cust,td.col-cust{position:sticky;left:0;z-index:20;background:var(--surface);border-right:1px solid var(--line-2)}
thead th.col-cust{z-index:40;background:var(--hdr)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.col-cust{text-align:left}
/* 行样式 */
tr.group-row td{background:var(--group)}
tr.group-row td.col-cust{border-left:3px solid var(--brand)}
tr.detail-row td{background:#fff}
tr.detail-row.zebra td{background:var(--zebra)}
tr.total-row td{background:#F1F4F9;border-top:1px solid var(--line-2);border-bottom:none;font-weight:700;color:var(--ink-900)}
tr.total-row td.col-cust{background:#F1F4F9}
@media (hover:hover){
  tr.detail-row:hover td{background:#F2F6FC}
  tr.detail-row:hover td.col-cust{background:#F2F6FC}
}
/* 客户/区域合并单元格 */
.cust-name{font-size:13px;font-weight:600;color:var(--ink-900);line-height:1.35;word-break:break-all}
.cust-region{font-size:11px;color:var(--t2);margin-top:1px;line-height:1.3}
.d-cust{font-size:12px;color:#6B7787;line-height:1.35;word-break:break-all}
.d-region{font-size:10.5px;color:var(--t3);line-height:1.3}
/* 商品chip */
.chip-prod{
  position:relative;
  display:inline-flex;align-items:center;gap:3px;max-width:100%;
  padding:3px 8px;border-radius:7px;
  border:1px solid #DCE4EE;background:#F4F7FB;color:#24435F;
  font-size:12.5px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background .12s,transform .08s;
}
.chip-prod::after{content:"";position:absolute;inset:-8px}
.chip-prod:active{background:#E7EEF7;transform:scale(.96)}
.chip-prod svg{flex:none;color:#7C93AB}
td.col-prod{text-align:left}
.muted{color:var(--t3)}
.badge-ov{
  display:inline-block;min-width:34px;text-align:center;
  padding:2px 6px;border-radius:7px;
  background:var(--alert-soft);color:var(--alert);
  font-weight:700;font-size:12.5px;
  font-variant-numeric:tabular-nums;
}
/* 合计 */
tfoot td{position:sticky;bottom:0;z-index:25;background:var(--surface)}
tfoot td.col-cust{z-index:26}
/* 空态 */
.empty-row td{padding:0;background:var(--surface)}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 20px;color:var(--t3);text-align:center;
}
.empty-state svg{color:#C3CCD8;margin-bottom:12px}
.empty-state .em-title{font-size:14px;font-weight:600;color:#7C8798}
.empty-state .em-sub{font-size:12px;margin-top:5px;color:var(--t3);line-height:1.6}
/* ===== 悬浮提示框 ===== */
.pop{
  position:fixed;z-index:100;
  max-width:300px;min-width:180px;
  background:#fff;border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 8px 28px rgba(49,100,174,.16);
  padding:10px 12px;
  display:none;
}
.pop.show{display:block;animation:popIn .16s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pop-arrow{
  position:absolute;width:10px;height:10px;background:#fff;
  border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);
  transform:rotate(45deg);
}
.pop-title{font-size:13px;font-weight:700;color:var(--ink-900);padding-right:16px}
.pop-close{
  position:absolute;top:5px;right:5px;width:30px;height:30px;
  border:none;background:none;color:var(--t3);cursor:pointer;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
}
.pop-close:active{background:#F0F3F7}
.pop-row{display:flex;gap:8px;margin-top:7px;font-size:12.5px;line-height:1.5}
.pop-k{color:var(--t2);flex:none;width:32px}
.pop-v{color:var(--t1);font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
/* ===== 底部注释 ===== */
.app-footer{
  flex:none;background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
}
.rule-note{font-size:11px;color:var(--t3);line-height:1.6}
/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:rgba(49,100,174,.92);color:#fff;font-size:12.5px;
  padding:8px 14px;border-radius:9px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:120;max-width:82vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 横屏旋转 ===== */
@media (max-width:820px){
  html.landscape-mode body{overflow:hidden}
  html.landscape-mode #app{
    position:fixed;top:0;left:0;
    width:100vh;height:100vw;max-width:none;max-height:none;
    aspect-ratio:auto;
    transform:translateY(100vh) rotate(-90deg);
    transform-origin:top left;
  }
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

// ===== 工具函数 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, dec = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: dec});

// ===== 数据与状态 =====
const SOURCE = window.__REPORT_DATA__ || {groups: []};
const TABS = {
  jb:  {name: '建发本部', groups: SOURCE.groups || []},
  hz:  {name: '合资',     groups: []},
  xjy: {name: '新吉悦',   groups: []}
};
const state = {tab: 'jb', landscape: false, wide: false};

// 页签计数
const CNT = {jb: 'cntJb', hz: 'cntHz', xjy: 'cntXjy'};
for (const k in TABS) {
  const el = $('#' + CNT[k]);
  el.textContent = TABS[k].groups.length;
  el.classList.toggle('zero', TABS[k].groups.length === 0);
}

// ===== 渲染 =====
// 客户维度是否有逾期（组行逾期>0 或 任一商品明细逾期>0）
const hasOverdue = g => (g.group.逾期数量 || 0) > 0 || g.items.some(it => (it.逾期数量 || 0) > 0);

function visibleGroups() {
  return TABS[state.tab].groups.filter(hasOverdue);
}

function numCell(obj, key, dec) {
  const v = obj[key];
  return `<td class="num">${v == null ? '<span class="muted">—</span>' : fmt(v, dec)}</td>`;
}
function pctCell(obj, key) {
  const v = obj[key];
  return `<td class="num">${v == null ? '<span class="muted">—</span>' : fmt(v, 1) + '%'}</td>`;
}
function ovCell(obj) {
  const v = obj.逾期数量;
  return `<td class="num">${(v || 0) > 0 ? `<span class="badge-ov">${fmt(v)}</span>` : '<span class="muted">—</span>'}</td>`;
}
const INFO_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg>';

function render() {
  const gs = visibleGroups();
  let html = '';
  let detailCount = 0;

  for (const g of gs) {
    const items = g.items;
    html += `<tr class="group-row">
      <td class="col-cust">
        <div class="cust-name">${esc(g.customer)}</div>
        <div class="cust-region">${esc(g.region || '—')}</div>
      </td>
      <td class="col-prod"><span class="muted">—</span></td>
      ${numCell(g.group, '未履约数量', 0)}
      ${ovCell(g.group)}
      ${numCell(g.group, '销售均价', 2)}
      ${numCell(g.group, '未履约总金额', 1)}
      ${pctCell(g.group, '约定比例')}
      ${pctCell(g.group, '实收覆盖率')}
      ${numCell(g.group, '月均销量', 0)}
      ${numCell(g.group, '存销比', 1)}
    </tr>`;
    for (const it of items) {
      detailCount++;
      const z = detailCount % 2 ? '' : ' zebra';
      html += `<tr class="detail-row${z}">
        <td class="col-cust">
          <div class="d-cust">${esc(g.customer)}</div>
          <div class="d-region">${esc(g.region || '')}</div>
        </td>
        <td class="col-prod">
          <button class="chip-prod" data-product="${esc(it.product || '')}" data-brand="${esc(it.brand || '')}">${esc(it.product || '—')}${INFO_ICON}</button>
        </td>
        ${numCell(it, '未履约数量', 0)}
        ${ovCell(it)}
        ${numCell(it, '销售均价', 2)}
        ${numCell(it, '未履约总金额', 1)}
        ${pctCell(it, '约定比例')}
        ${pctCell(it, '实收覆盖率')}
        ${numCell(it, '月均销量', 0)}
        ${numCell(it, '存销比', 1)}
      </tr>`;
    }
  }

  if (!gs.length) {
    html += `<tr class="empty-row"><td colspan="10"><div class="empty-state">
      <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      <div class="em-title">暂无数据</div>
      <div class="em-sub">该页签尚未接入数据<br>配置数据源后自动展示</div>
    </div></td></tr>`;
  }
  $('#tbody').innerHTML = html;
  renderTotals(gs);
  renderKPI();
}

function renderTotals(gs) {
  const tfoot = $('#tfoot');
  if (!gs.length) { tfoot.innerHTML = ''; return; }
  const items = gs.flatMap(g => g.items);
  const sum = k => items.reduce((a, it) => a + (it[k] || 0), 0);
  const wl = sum('未履约数量'), ov = sum('逾期数量'), amt = sum('未履约总金额'), mo = sum('月均销量');
  const avgPrice = wl ? amt * 10000 / wl : null;
  const dep = mo ? wl / mo : null;
  const wDep = k => {
    let num = 0, den = 0;
    for (const it of items) {
      if (it[k] == null) continue;
      const w = it.未履约总金额 || 0;
      num += it[k] * w; den += w;
    }
    return den ? num / den : null;
  };
  const jb = wDep('约定比例'), sc = wDep('实收覆盖率');
  tfoot.innerHTML = `<tr class="total-row">
    <td class="col-cust">合计</td>
    <td class="col-prod"><span class="muted">—</span></td>
    <td class="num">${fmt(wl)}</td>
    <td class="num">${ov > 0 ? `<span class="badge-ov">${fmt(ov)}</span>` : '<span class="muted">—</span>'}</td>
    <td class="num">${avgPrice == null ? '—' : fmt(avgPrice, 0)}</td>
    <td class="num">${fmt(amt, 1)}</td>
    <td class="num">${jb == null ? '—' : fmt(jb, 1) + '%'}</td>
    <td class="num">${sc == null ? '—' : fmt(sc, 1) + '%'}</td>
    <td class="num">${fmt(mo)}</td>
    <td class="num">${dep == null ? '—' : fmt(dep, 1)}</td>
  </tr>`;
}

function renderKPI() {
  const gs = TABS[state.tab].groups;
  const elOv = $('#kpiOv'), elCust = $('#kpiCust');
  if (!gs.length) { elOv.textContent = '—'; elCust.textContent = '—'; return; }
  const items = gs.flatMap(g => g.items);
  const sum = k => items.reduce((a, it) => a + (it[k] || 0), 0);
  const ov = sum('逾期数量');
  const ovCust = gs.filter(g => g.items.some(it => (it.逾期数量 || 0) > 0)).length;
  elOv.innerHTML = `${fmt(ov)}<span class="unit">吨</span>`;
  elCust.innerHTML = `${ovCust}<span class="unit">家</span>`;
}

// ===== 页签切换 =====
$('#tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => {
    const on = t === btn;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', String(on));
  });
  state.tab = btn.dataset.tab;
  closePop();
  $('#tblScroll').scrollTop = 0;
  render();
});

function showPop(anchor, opts) {
  closePop();
  const pop = $('#pop');
  $('#popTitle').textContent = opts.title || '';
  if (opts.brand != null) {
    $('#popBrand').textContent = opts.brand || '—';
    $('#popBrand').closest('.pop-row').style.display = '';
  } else {
    $('#popBrand').closest('.pop-row').style.display = 'none';
  }
  if (opts.product != null) {
    $('#popProduct').textContent = opts.product || '—';
    $('#popProdRow').style.display = '';
  } else {
    $('#popProdRow').style.display = 'none';
  }
  pop.classList.add('show');
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = r.top - ph - 8;
  if (top < 8) top = 8;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  popOpen = true;
}
function closePop() {
  $('#pop').classList.remove('show');
  popOpen = false;
}

$('#tbody').addEventListener('click', e => {
  const chip = e.target.closest('.chip-prod');
  if (chip) {
    showPop(chip, {title: chip.dataset.product || '商品信息', brand: chip.dataset.brand, product: chip.dataset.product});
    return;
  }
});
$('#popClose').addEventListener('click', closePop);
document.addEventListener('click', e => {
  if (!popOpen) return;
  if (e.target.closest('#pop') || e.target.closest('.chip-prod')) return;
  closePop();
});
$('#tblScroll').addEventListener('scroll', () => { if (popOpen) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('resize', closePop);

// ===== 横屏 / 加宽 =====
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function isNarrow() { return window.innerWidth <= 820; }
$('#btnRotate').addEventListener('click', () => {
  if (isNarrow()) {
    state.landscape = !state.landscape;
    document.documentElement.classList.toggle('landscape-mode', state.landscape);
    $('#btnRotateTxt').textContent = state.landscape ? '竖屏' : '横屏';
    toast(state.landscape ? '已旋转横屏，表格视野更宽' : '已恢复竖屏');
  } else {
    state.wide = !state.wide;
    $('#app').classList.toggle('wide-mode', state.wide);
    $('#btnRotateTxt').textContent = state.wide ? '还原' : '横屏';
    toast(state.wide ? '桌面端已切换加宽模式' : '已还原');
  }
  const sc = $('#tblScroll');
  sc.scrollLeft = 0; sc.scrollTop = 0;
});

// ===== 更新时间（每小时） =====
function tick() {
  const d = new Date();
  $('#clock').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}时`;
}
tick();
setInterval(tick, 30000);

// ===== 初始化 =====
render();
</script>
</body>
</html>
